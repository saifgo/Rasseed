<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Sarfli · Hors ligne</title>
<style>
  :root { color-scheme: light dark; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: #fff; color: #262626; padding: 24px; box-sizing: border-box; }
  @media (prefers-color-scheme: dark) { body { background: #0a0a0a; color: #f5f5f5; } }
  main { max-width: 22rem; text-align: center; display: grid; gap: 14px; justify-items: center; }
  img { width: 64px; height: 64px; border-radius: 16px; }
  h1 { font-size: 1.25rem; margin: 6px 0 0; }
  p { margin: 0; color: #737373; line-height: 1.45; }
  p[dir="rtl"] { font-size: 1.05rem; }
  button { margin-top: 10px; min-height: 44px; padding: 0 22px; border: 0; border-radius: 10px; background: #262626; color: #fafafa; font: inherit; font-weight: 600; cursor: pointer; }
  @media (prefers-color-scheme: dark) { button { background: #f5f5f5; color: #262626; } }
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="">
  <h1>Pas de connexion</h1>
  <p>Vérifiez votre connexion internet, puis réessayez.</p>
  <p dir="rtl" lang="ar">لا يوجد اتصال بالإنترنت. تحقّق من الاتصال ثم أعد المحاولة.</p>
  <p lang="en">You're offline. Check your connection and try again.</p>
  <button type="button" onclick="location.reload()">Réessayer · إعادة المحاولة · Retry</button>
</main>
<script>addEventListener("online", () => location.reload());</script>
</body>
</html>
